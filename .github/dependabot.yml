version: 2
updates:
  # Next.js, React, and Frontend UI Packages (weekly)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Kolkata'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'type: dependencies'
      - 'domain: infra'
    open-pull-requests-limit: 10
    groups:
      nextjs:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'

  # GitHub Actions (monthly)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'type: dependencies'
      - 'domain: infra'