name: Frontend CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Frontend (campus-web)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v7

      - name: 🛠️ Setup Workspace & Dependencies
        uses: ./.github/actions/setup-workspace

      - name: 🧹 Lint Next.js & Tailwind
        run: pnpm lint
        continue-on-error: false

      - name: 🔍 TypeScript Strict Type Check
        run: pnpm tsc --noEmit

      - name: 🏗️ Production Next.js Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: "https://workspace-campus-api.onrender.com/api"
          NEXT_PUBLIC_WS_URL: "https://workspace-campus-api.onrender.com"