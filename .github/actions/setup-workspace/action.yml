name: 'Setup Frontend Workspace'
description: 'Sets up Node.js 20, pnpm 9, and caches dependencies'

runs:
  using: 'composite'
  steps:
    - name: ⚙️ Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        run_install: false

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: 📦 Install Dependencies
      shell: bash
      run: pnpm install --no-frozen-lockfile